[project]
name = "kahaani"
version = "0.1.0"
description = "Personalised, illustrated, narrated children's storybooks in Hindi and English"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "google-genai>=1.20",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "weasyprint>=70.0",
    "jinja2>=3.1.6",
    "edge-tts>=7.3.1",
    "moviepy>=2",
    "pdf2image>=1.17.0",
    "pillow>=11.3.0",
    "fastapi>=0.162.4",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy>=2.1.8",
    "psycopg[binary]>=3.3.9",
    "pyjwt[crypto]>=2.15.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
eval = [
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "open-clip-torch>=4.2.2",
    "pandas>=3.1.1",
    "torch>=2.15.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI-style defaults.
"kahaani/api.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
